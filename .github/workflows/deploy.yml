# Le site est construit et hébergé par Cloudflare Pages, relié à ce dépôt : chaque push sur main
# déclenche un déploiement côté Cloudflare.
# Ce workflow fait deux choses :
#  - à chaque push et pull request : audit des dépendances, tests et build de contrôle ;
#  - chaque matin : appel du « deploy hook » Cloudflare pour reconstruire le site et mettre en ligne
#    les articles planifiés dont la date est atteinte.
# Secret à créer dans Settings > Secrets and variables > Actions : CLOUDFLARE_DEPLOY_HOOK
# (l'URL du deploy hook, créée dans Cloudflare > projet Pages > Settings > Builds > Deploy hooks).
# Chaque action est épinglée par le SHA complet de son commit ; Dependabot propose les mises à jour.
name: Tests et publication

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts : aucun script d'installation de dépendance n'est exécuté dans la CI.
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  rebuild:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher la reconstruction Cloudflare Pages
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Secret CLOUDFLARE_DEPLOY_HOOK absent."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Reconstruction demandée."
